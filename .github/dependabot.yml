version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # One PR for the routine minor/patch churn instead of one per package.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Framework majors are migrations — take them deliberately, not via
      # auto-bump. Minors and patches still flow.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
