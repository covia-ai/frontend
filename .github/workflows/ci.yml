name: CI

# Build-and-test quality gate. Runs on every pull request and on pushes to
# the long-lived branches. Pair this with required-status-check branch
# protection rules on develop/main for the "lint", "build", and "test" jobs
# below — the workflow alone reports status but does not block a merge on
# its own.

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # `next build` only type-checks the app graph, so nothing was checking
      # __tests__/ — which is how three type errors accumulated there unseen.
      - name: Type-check
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (also type-checks)
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Coverage runs here, not in `pnpm test`: the inner loop stays fast while
      # CI enforces the coverageThreshold ratchet in jest.config.js.
      - name: Test (with coverage thresholds)
        run: pnpm run test:coverage
